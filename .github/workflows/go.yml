name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: true

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      # Integration tests (real internet)
      # If this fails due to network/site issues,
      # it will not fail the entire pipeline.
      - name: Integration tests
        run: go test -tags=integration ./...
        continue-on-error: true
